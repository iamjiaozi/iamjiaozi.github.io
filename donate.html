<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打赏支持 - Jiaozi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 800px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #555;
        }
        .qr-codes {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .qr-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-item img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .qr-item span {
            margin-top: 0.5rem;
            font-weight: bold;
            color: #666;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>感谢您的支持</h1>
        <p>四旬老汉开发 Chrome 扩展不宜，如果您觉得我的作品对您有帮助，</br> 希望大家打赏支持，您的支持是我持续更新的动力。</p>
        
        <div class="qr-codes">
            <div class="qr-item">
                <img src="images/wechat-pay.jpg" alt="微信支付">
                <span>微信支付</span>
            </div>
            <div class="qr-item">
                <img src="images/ali-pay.jpg" alt="支付宝">
                <span>支付宝</span>
            </div>
        </div>
        
        <footer>
            &copy; 2025 四旬老汉. All rights reserved.
        </footer>
    </div>
</body>
</html>
